<!--
============================================================
ARQUIVO: login.html
FUNÇÃO: Exibe formulário de autenticação e opção de reenviar verificação.
USADO POR: navegador; app.js envia o formulário à API.
============================================================
-->
<!doctype html>
<html lang="pt-BR">
    <!-- METADADOS E RECURSOS: carrega estilos e tipografia da interface. -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrar — Auth System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <!-- LOGIN: credenciais, preferência da sessão e recuperação de acesso. -->
    <body class="auth-page">
        <nav class="nav shell">
            <a class="brand" href="/"
                ><span class="brand-mark">A</span
                ><span>Auth<span class="brand-muted">System</span></span></a
            ><a class="text-link" href="/register.html"
                >Criar conta <span>→</span></a
            >
        </nav>
        <main class="auth-shell">
            <div class="auth-intro">
                <p class="eyebrow">BEM-VINDO DE VOLTA</p>
                <h1>Entre no seu<br /><em>espaço seguro.</em></h1>
                <p>
                    Continue de onde parou com uma sessão protegida e feita para
                    você.
                </p>
            </div>
            <div class="form-card">
                <div class="form-heading">
                    <span class="form-icon">↗</span>
                    <div>
                        <h2>Fazer login</h2>
                        <p>Use suas credenciais para continuar.</p>
                    </div>
                </div>
                <!-- FORMULÁRIO DE AUTENTICAÇÃO: app.js serializa e envia os campos. -->
                <form data-form="login">
                    <label for="email"
                        >E-mail<input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="voce@exemplo.com"
                            required /></label
                    ><label for="password"
                        >Senha<input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            required
                    /></label>
                    <div class="form-meta">
                        <label class="check"
                            ><input type="checkbox" /> Lembrar de mim</label
                        ><a href="/forgot-password.html">Esqueci minha senha</a>
                    </div>
                    <button
                        class="button button-ghost button-full"
                        type="button"
                        data-resend-verification
                    >
                        Reenviar confirmação de e-mail
                    </button>
                    <div class="form-message" aria-live="polite"></div>
                    <button
                        class="button button-primary button-full"
                        type="submit"
                    >
                        Entrar <span>→</span>
                    </button>
                </form>
                <p class="form-switch">
                    Ainda não tem uma conta?
                    <a href="/register.html">Cadastre-se</a>
                </p>
            </div>
        </main>
        <!-- COMPORTAMENTO: handlers externos, sem script inline para respeitar CSP. -->
        <script src="/app.js"></script>
    </body>
</html>
