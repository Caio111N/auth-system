<!--
============================================================
ARQUIVO: register.html
FUNÇÃO: Apresenta o formulário de criação de conta e validações de navegador.
USADO POR: navegador; app.js envia os dados à API.
============================================================
-->
<!doctype html>
<html lang="pt-BR">
    <!-- METADADOS E RECURSOS: carrega estilos e fontes da aplicação. -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Criar conta — Auth System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <!-- CADASTRO: coleta nome, e-mail, senha e confirmação local da senha. -->
    <body class="auth-page">
        <nav class="nav shell">
            <a class="brand" href="/"
                ><span class="brand-mark">A</span
                ><span>Auth<span class="brand-muted">System</span></span></a
            ><a class="text-link" href="/login.html"
                >Já tenho conta <span>→</span></a
            >
        </nav>
        <main class="auth-shell">
            <div class="auth-intro">
                <p class="eyebrow">SEU PRÓXIMO PASSO</p>
                <h1>Crie uma conta<br /><em>do seu jeito.</em></h1>
                <p>
                    Leva menos de um minuto. Seus dados ficam protegidos desde o
                    primeiro instante.
                </p>
            </div>
            <div class="form-card">
                <div class="form-heading">
                    <span class="form-icon">✦</span>
                    <div>
                        <h2>Criar conta</h2>
                        <p>Comece sua experiência segura.</p>
                    </div>
                </div>
                <!-- FORMULÁRIO: a senha de confirmação é comparada no frontend antes do POST. -->
                <form data-form="register">
                    <label for="name"
                        >Nome completo<input
                            id="name"
                            name="name"
                            type="text"
                            autocomplete="name"
                            placeholder="Como podemos te chamar?"
                            minlength="2"
                            maxlength="100"
                            required /></label
                    ><label for="email"
                        >E-mail<input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="voce@exemplo.com"
                            required /></label
                    ><label for="password"
                        >Senha<input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Mínimo de 10 caracteres"
                            minlength="10"
                            required /></label
                    ><label for="confirmPassword"
                        >Confirmar senha<input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Repita sua senha"
                            minlength="10"
                            required
                    /></label>
                    <div class="form-message" aria-live="polite"></div>
                    <button
                        class="button button-primary button-full"
                        type="submit"
                    >
                        Criar minha conta <span>→</span>
                    </button>
                </form>
                <p class="form-switch">
                    Já possui acesso? <a href="/login.html">Entrar agora</a>
                </p>
            </div>
        </main>
        <!-- COMPORTAMENTO: carrega handlers externos compatíveis com CSP. -->
        <script src="/app.js"></script>
    </body>
</html>
