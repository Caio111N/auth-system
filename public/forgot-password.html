<!--
============================================================
ARQUIVO: forgot-password.html
FUNÇÃO: Permite solicitar instruções de recuperação de senha por e-mail.
USADO POR: usuário que perdeu acesso; app.js chama o endpoint de recuperação.
============================================================
-->
<!doctype html>
<html lang="pt-BR">
    <!-- METADADOS E RECURSOS: carrega estilos e fontes compartilhados. -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Recuperar senha — Auth System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <!-- RECUPERAÇÃO: coleta somente o e-mail e apresenta feedback neutro. -->
    <body class="auth-page">
        <nav class="nav shell">
            <a class="brand" href="/"
                ><span class="brand-mark">A</span
                ><span>Auth<span class="brand-muted">System</span></span></a
            ><a class="text-link" href="/login.html">Voltar ao login</a>
        </nav>
        <main class="auth-shell single">
            <div class="form-card">
                <div class="form-heading">
                    <span class="form-icon">⌁</span>
                    <div>
                        <h2>Recuperar senha</h2>
                        <p>Enviaremos instruções para seu e-mail.</p>
                    </div>
                </div>
                <!-- FORMULÁRIO: não informa na interface se o e-mail existe. -->
                <form data-form="forgot">
                    <label for="email"
                        >E-mail cadastrado<input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="voce@exemplo.com"
                            required
                    /></label>
                    <div class="form-message" aria-live="polite"></div>
                    <button
                        class="button button-primary button-full"
                        type="submit"
                    >
                        Enviar instruções <span>→</span>
                    </button>
                </form>
                <p class="form-switch">
                    <a href="/login.html">← Voltar para entrar</a>
                </p>
            </div>
        </main>
        <!-- COMPORTAMENTO: handlers externos compatíveis com CSP. -->
        <script src="/app.js"></script>
    </body>
</html>
