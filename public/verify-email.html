<!--
============================================================
ARQUIVO: verify-email.html
FUNÇÃO: Permite consumir o token de confirmação enviado ao endereço da conta.
USADO POR: usuário que recebeu o e-mail; app.js envia o token à API.
============================================================
-->
<!doctype html>
<html lang="pt-BR">
    <!-- METADADOS E RECURSOS: carrega os estilos comuns do frontend. -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verificar e-mail — Auth System</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <!-- VERIFICAÇÃO: confirma token obtido pelo script externo da query string. -->
    <body class="auth-page">
        <nav class="nav shell">
            <a class="brand" href="/"
                ><span class="brand-mark">A</span
                ><span>Auth<span class="brand-muted">System</span></span></a
            >
            <a class="text-link" href="/login.html">Voltar ao login</a>
        </nav>
        <main class="auth-shell single">
            <div class="form-card">
                <div class="form-heading">
                    <span class="form-icon">✓</span>
                    <div>
                        <h2>Confirmar e-mail</h2>
                        <p>Verifique o endereço associado à sua conta.</p>
                    </div>
                </div>
                <!-- FORMULÁRIO: o endpoint verifica o token de uso único no servidor. -->
                <form data-form="verify-email">
                    <div class="form-message" aria-live="polite"></div>
                    <button
                        class="button button-primary button-full"
                        type="submit"
                    >
                        Confirmar e-mail
                    </button>
                </form>
            </div>
        </main>
        <!-- COMPORTAMENTO: handlers externos compatíveis com CSP. -->
        <script src="/app.js"></script>
    </body>
</html>
