<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nova senha — Auth System</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page"><nav class="nav shell"><a class="brand" href="/"><span class="brand-mark">A</span><span>Auth<span class="brand-muted">System</span></span></a><a class="text-link" href="/login.html">Voltar ao login</a></nav><main class="auth-shell single"><div class="form-card"><div class="form-heading"><span class="form-icon">✓</span><div><h2>Defina uma nova senha</h2><p>Escolha uma senha forte para proteger sua conta.</p></div></div><form data-form="reset"><label for="password">Nova senha<input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" minlength="8" required></label><label for="confirmPassword">Confirmar senha<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita sua senha" minlength="8" required></label><div class="form-message" aria-live="polite"></div><button class="button button-primary button-full" type="submit">Salvar nova senha <span>→</span></button></form></div></main><script src="/app.js"></script></body>
</html>
