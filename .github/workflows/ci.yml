# ------------------------------------------------------------
# GATILHOS: executa a validação em push e pull request
# ------------------------------------------------------------
name: CI

on:
    push:
    pull_request:

jobs:
    # MATRIZ: verifica as versões Node suportadas pelo projeto.
    verify:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 22]
        env:
            NODE_ENV: test
            LOG_LEVEL: silent
            JWT_SECRET: ci-only-secret-for-non-production-tests
        steps:
            # Checkout e runtime necessários para instalar dependências reproduzíveis.
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm test
            - name: Audit production dependencies
              run: npm audit --omit=dev
